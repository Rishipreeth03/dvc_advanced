
stages:
  prepare:
    cmd: python src/prepare.py
    deps:
      - src/prepare.py
      - data/iris.csv
    outs:
      - data/train.csv
      - data/test.csv

  train:
    cmd: python src/train.py
    deps:
      - src/train.py
      - data/train.csv
      - data/test.csv
    params:
      - model.C
      - model.max_iter
      - split.test_size
    metrics:
      - metrics.json
    plots:
      - plots/roc.csv
    outs:
      - model.pkl
